<!DOCTYPE html>
<html class="no-js" lang="en">

<head>
  <!-- Meta Tags -->
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Christian">
  <!-- Page Title -->
  <title>Social Media Gallery - Christian Simeon</title>
  <!-- Favicon Icon -->
  <link rel="icon" href="assets/img/favicon.png" />
  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/css/fontawesome.css" />
  <link rel="stylesheet" href="assets/css/lightgallery.min.css" />
  <link rel="stylesheet" href="assets/css/animate.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .gallery-header {
      background-color: #0a101e;
      padding: 60px 0 40px;
      text-align: center;
    }
    .gallery-header h1 {
      color: #fec544;
      font-size: 42px;
      margin-bottom: 10px;
    }
    .gallery-header p {
      color: #a9adb8;
      font-size: 18px;
    }
    .gallery-container {
      padding: 60px 0;
      background-color: #0a101e;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      padding: 15px;
    }
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .gallery-item:hover {
      transform: scale(1.05);
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
    }
    .back-button {
      text-align: center;
      padding: 40px 0;
    }
    .back-button a {
      color: #fec544;
      text-decoration: none;
      font-size: 18px;
      transition: color 0.3s ease;
    }
    .back-button a:hover {
      color: #ffffff;
    }
    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
      }
      .gallery-header h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <!-- Gallery Header -->
  <div class="gallery-header">
    <div class="container">
      <h1>Rockavilla Realty & Development Corporation</h1>
      <p>Social Media Poster Gallery</p>
    </div>
  </div>

  <!-- Gallery Container -->
  <div class="gallery-container">
    <div class="container">
      <div class="gallery-grid st-lightgallery" id="social-media-gallery">
        <div class="gallery-item">
          <a href="assets/img/portfolio/rocka/1.png" class="st-lightbox-item">
            <img src="assets/img/portfolio/rocka/1.png" alt="Social Media Poster 1">
          </a>
        </div>
        <div class="gallery-item">
          <a href="assets/img/portfolio/rocka/2.png" class="st-lightbox-item">
            <img src="assets/img/portfolio/rocka/2.png" alt="Social Media Poster 2">
          </a>
        </div>
        <div class="gallery-item">
          <a href="assets/img/portfolio/rocka/3.png" class="st-lightbox-item">
            <img src="assets/img/portfolio/rocka/3.png" alt="Social Media Poster 3">
          </a>
        </div>
        <div class="gallery-item">
          <a href="assets/img/portfolio/rocka/4.png" class="st-lightbox-item">
            <img src="assets/img/portfolio/rocka/4.png" alt="Social Media Poster 4">
          </a>
        </div>
        <div class="gallery-item">
          <a href="assets/img/portfolio/rocka/5.png" class="st-lightbox-item">
            <img src="assets/img/portfolio/rocka/5.png" alt="Social Media Poster 5">
          </a>
        </div>
        <div class="gallery-item">
          <a href="assets/img/portfolio/rocka/6.png" class="st-lightbox-item">
            <img src="assets/img/portfolio/rocka/6.png" alt="Social Media Poster 6">
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Back Button -->
  <div class="back-button">
    <div class="container">
      <a href="index3.html#portfolio">← Back to Portfolio</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/jquery-1.12.4.min.js"></script>
  <script src="assets/js/lightgallery.min.js"></script>
  <script>
    (function($) {
      $(document).ready(function() {
        // Initialize lightgallery
        $('#social-media-gallery').lightGallery({
          selector: '.st-lightbox-item',
          mode: 'lg-fade',
          cssEasing: 'cubic-bezier(0.25, 0, 0.25, 1)'
        });
      });
    })(jQuery);
  </script>
</body>
</html>
